name: Auto Update Weather

on:
  schedule:
    # 每天香港時間早上 8 點執行 (UTC 時間 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許你隨時手動按按鈕執行

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas matplotlib

      - name: Run weather script
        run: python weather.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add weather_forecast.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather forecast CSV" && git push)
